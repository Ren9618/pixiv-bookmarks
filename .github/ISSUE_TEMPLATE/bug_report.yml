name: Bug report
description: Something is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove passwords, refresh tokens,
        cookies, `.env` values, and callback URLs containing `code=` before
        posting. Security issues belong in the private reporting flow
        described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or the release tag.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Viewer UI
        - Sync / download
        - Account setup (OAuth)
        - Docker / deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        `docker compose logs viewer` and `docker compose logs sync`.
        Redact tokens, cookies, passwords, and personal paths.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Docker version, browser, phone model"
