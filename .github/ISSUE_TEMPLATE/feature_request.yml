name: Feature request
description: Suggest an improvement or a new feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds or other approaches.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I am willing to open a pull request.
        - label: This affects mobile / touch navigation.
        - label: This changes account handling or credentials.
