[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pixivapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-ra"
