<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131519">
  <title>ログイン | {{ app_name }}</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=20261103-8">
</head>
<body class="login-body" data-title-key="login.pageTitle" data-app-name="{{ app_name }}">
  <main class="login-wrap">
    <div class="login-card">
      <h1>{{ app_name }}</h1>
      <p class="login-sub" data-i18n="login.subtitle">ブックマークビューワー</p>

      {% if error %}
      <p class="login-error"{% if error_code %} data-i18n-error="{{ error_code }}"{% endif %}>{{ error }}</p>
      {% endif %}

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <label class="login-label" for="password" data-i18n="login.password">パスワード</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
        <button class="primary-button login-button" type="submit" data-i18n="login.open">開く</button>
      </form>
      <p class="login-note" data-i18n="login.note">Tailscale または自宅LANからのみアクセスできます。</p>
      <button id="langToggle" class="lang-button login-lang" type="button" lang="en" aria-label="Switch to English">EN</button>
    </div>
  </main>
  <script src="/static/i18n.js?v=20261103-8" defer></script>
</body>
</html>
