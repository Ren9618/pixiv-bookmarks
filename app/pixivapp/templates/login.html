<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101118">
  <title>ログイン | {{ app_name }}</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-mark" aria-hidden="true">p</div>
      <h1>{{ app_name }}</h1>
      <p class="login-sub">ブックマークビューワー</p>

      {% if error %}
      <p class="login-error">{{ error }}</p>
      {% endif %}

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <label class="login-label" for="password">パスワード</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
        <button class="primary-button login-button" type="submit">開く</button>
      </form>
      <p class="login-note">Tailscale または自宅LANからのみアクセスできます。</p>
    </div>
  </main>
</body>
</html>
